name: Deploy static site

# Drop-in replacement for presskittie's .github/workflows/build.yml.
# Only change from upstream: deploys with the built-in GITHUB_TOKEN instead of
# a hand-made ACCESS_TOKEN secret, so no personal access token is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docker:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: docker compose -f "docker-compose.yml" up -d --build

      - name: Mirror site
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080 >/dev/null && break
            sleep 2
          done
          mkdir -p output
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent \
               --no-host-directories --directory-prefix=output http://127.0.0.1:8080 || true

      - name: Stop containers
        if: always()
        run: docker compose -f "docker-compose.yml" down

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: output
